<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>冰壶大作战 · 10 秒原型</title>
<style>
:root {
  --bg: #050b18;
  --panel: rgba(9, 22, 42, 0.72);
  --cyan: #5fe3ff;
  --cyan-strong: #38c8f0;
  --gold: #ffd34d;
  --text: #eaf7ff;
  --muted: #8fb3cc;
  --red: #ff5d6c;
  --green: #39e58c;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: var(--bg);
  overflow: hidden;
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  justify-content: center;
  align-items: stretch;
}

#app {
  position: relative;
  width: min(100vw, 520px);
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #12345a 0%, #071226 55%, #040913 100%);
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#app::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 25%, rgba(0, 0, 0, 0.55) 100%);
}

/* ---------- HUD ---------- */

#hud {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding: calc(14px + env(safe-area-inset-top)) 18px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 2;
}

.score-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
}

#score {
  font-size: 34px;
  font-weight: 800;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 18px rgba(95, 227, 255, 0.35);
}

.sub-row {
  display: flex;
  gap: 8px;
  margin-top: 2px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

#mult {
  color: var(--gold);
  font-weight: 800;
}

#combo {
  color: var(--cyan);
}

#chain {
  color: var(--gold);
  font-weight: 700;
}

#targetLabel {
  margin-top: 5px;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

#targetWrap {
  width: 150px;
  height: 4px;
  margin-top: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

#targetBar {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #5fe3ff, #ffd34d);
  transition: width 0.12s linear;
}

.hud-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  font-size: 11px;
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.hud-btns {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}

.restart-btn {
  pointer-events: auto;
  height: 34px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(120, 200, 255, 0.25);
  background: rgba(10, 30, 55, 0.62);
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  backdrop-filter: blur(6px);
  white-space: nowrap;
}

.restart-btn:active {
  transform: scale(0.95);
  background: rgba(95, 227, 255, 0.18);
}

#throwLabel {
  color: var(--text);
  font-weight: 700;
  font-size: 12px;
}

.icon-btn {
  pointer-events: auto;
  margin-top: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(120, 200, 255, 0.25);
  background: rgba(10, 30, 55, 0.62);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
}

.icon-btn:active {
  transform: scale(0.94);
}

/* ---------- Toast ---------- */

#toast {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translate(-50%, -8px);
  padding: 10px 16px;
  border-radius: 999px;
  background: rgba(5, 18, 36, 0.84);
  border: 1px solid rgba(95, 227, 255, 0.35);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.22s ease, transform 0.22s ease;
  pointer-events: none;
  z-index: 3;
  white-space: nowrap;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- Bottom controls ---------- */

#bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0 18px calc(14px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 2;
  pointer-events: none;
}

#hint {
  text-align: center;
  font-size: 11px;
  color: rgba(200, 230, 255, 0.72);
  min-height: 14px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
}

#staminaWrap {
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  opacity: 0.35;
  transition: opacity 0.2s ease;
}

#stamina {
  height: 100%;
  width: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #5fe3ff, #39e58c);
  transition: width 0.08s linear;
}

#spinBar {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.spin-btn {
  flex: 1;
  height: 40px;
  border-radius: 14px;
  border: 1px solid rgba(120, 200, 255, 0.22);
  background: rgba(8, 24, 45, 0.72);
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
}

.spin-btn:active {
  transform: scale(0.97);
}

.spin-btn.active {
  color: #04121f;
  background: linear-gradient(180deg, #8ef2ff, #38c8f0);
  border-color: transparent;
  box-shadow: 0 0 18px rgba(95, 227, 255, 0.35);
}

/* ---------- Overlay ---------- */

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(3, 9, 20, 0.56);
  backdrop-filter: blur(10px);
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

#overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.card {
  width: 100%;
  max-width: 360px;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 24px 22px 20px;
  border-radius: 26px;
  background: linear-gradient(160deg, rgba(18, 44, 78, 0.96), rgba(6, 18, 36, 0.97));
  border: 1px solid rgba(120, 200, 255, 0.22);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #8ef2ff;
  background: rgba(95, 227, 255, 0.1);
  border: 1px solid rgba(95, 227, 255, 0.25);
}

.card h1 {
  margin: 12px 0 4px;
  font-size: 30px;
  letter-spacing: 0.04em;
}

.tagline {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 12px;
}

.how {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0 0 18px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 12px;
  color: #cfe9ff;
}

.how b {
  display: inline-flex;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(95, 227, 255, 0.16);
  color: #8ef2ff;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  margin-right: 8px;
}

.primary {
  width: 100%;
  height: 52px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(180deg, #9af4ff, #37c8f0);
  color: #04121f;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  letter-spacing: 0.08em;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(56, 200, 240, 0.35);
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}

.primary:active {
  transform: translateY(1px) scale(0.99);
  box-shadow: 0 6px 18px rgba(56, 200, 240, 0.3);
}

.primary:disabled {
  opacity: 0.45;
  cursor: default;
  box-shadow: none;
}

.secondary {
  width: 100%;
  height: 44px;
  margin-top: 8px;
  border: 1px solid rgba(120, 200, 255, 0.25);
  border-radius: 14px;
  background: rgba(10, 30, 55, 0.6);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 0.04em;
}

.secondary:active {
  transform: scale(0.98);
  background: rgba(95, 227, 255, 0.12);
}

#towerOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(3, 9, 20, 0.66);
  backdrop-filter: blur(10px);
  z-index: 6;
}

.tower-card {
  max-width: 360px;
}

.stone-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0 8px;
}

.stone-btn {
  height: 52px;
  border-radius: 14px;
  border: 1px solid rgba(120, 200, 255, 0.3);
  background: rgba(95, 227, 255, 0.08);
  color: var(--text);
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
}

.stone-btn .lvl {
  display: block;
  font-size: 9px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 1px;
}

.stone-btn.selected {
  border-color: var(--gold);
  background: rgba(255, 211, 77, 0.14);
  box-shadow: 0 0 16px rgba(255, 211, 77, 0.3);
}

.stone-btn.empty {
  border-style: dashed;
  opacity: 0.25;
  cursor: default;
}

.tower-atk {
  text-align: center;
  font-size: 12px;
  color: var(--gold);
  font-weight: 700;
  margin: 6px 0 10px;
}

.tower-tip {
  margin: 0 0 4px;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
}

.rune-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.rune-btn {
  min-height: 38px;
  padding: 6px 10px;
  border-radius: 12px;
  border: 1px solid rgba(120, 200, 255, 0.22);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}

.rune-btn.chosen {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(255, 211, 77, 0.1);
}

.ball-bar {
  display: flex;
  gap: 6px;
  pointer-events: auto;
}

.ball-chip {
  flex: 1;
  min-width: 0;
  height: 38px;
  padding: 4px 4px;
  border-radius: 12px;
  border: 1px solid rgba(120, 200, 255, 0.22);
  background: rgba(8, 24, 45, 0.72);
  color: var(--muted);
  font-family: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}

.ball-chip .ball-name {
  font-size: 10px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}

.ball-chip .ball-lv {
  font-size: 9px;
  color: var(--muted);
}

.ball-chip.selected {
  border-color: var(--gold);
  background: rgba(255, 211, 77, 0.14);
  box-shadow: 0 0 14px rgba(255, 211, 77, 0.25);
}

.ball-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 10px 0 8px;
}

.ball-card {
  padding: 9px 8px;
  border-radius: 14px;
  border: 1px solid rgba(120, 200, 255, 0.3);
  background: rgba(95, 227, 255, 0.07);
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.ball-card b {
  display: block;
  font-size: 13px;
}

.ball-card .ball-meta {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  color: var(--gold);
}

.ball-card .ball-desc {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  color: var(--muted);
  line-height: 1.3;
}

.ball-card.selected {
  border-color: var(--gold);
  background: rgba(255, 211, 77, 0.13);
  box-shadow: 0 0 16px rgba(255, 211, 77, 0.26);
}

.ball-card:disabled {
  opacity: 0.45;
  cursor: default;
}

.footnote {
  margin: 12px 0 0;
  font-size: 10px;
  color: rgba(160, 200, 230, 0.55);
}

.result-stats {
  margin: 0 0 16px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rs-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  color: var(--muted);
}

.rs-row b {
  color: var(--text);
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}

.rs-throws {
  display: flex;
  gap: 6px;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 10px;
  color: rgba(160, 200, 230, 0.72);
  font-variant-numeric: tabular-nums;
}

.rs-stars {
  text-align: center;
  font-size: 30px;
  letter-spacing: 6px;
  color: var(--gold);
  line-height: 1;
  margin: 2px 0 6px;
  text-shadow: 0 0 18px rgba(255, 211, 77, 0.35);
}

.rs-hint {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.hidden {
  display: none !important;
}

#overlay.result .how {
  display: none;
}

@media (min-width: 521px) {
  #app {
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.6);
  }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="冰壶大作战游戏画面"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div class="score-label">得分</div>
      <div id="score">0</div>
      <div class="sub-row">
        <span id="mult">×1.0</span>
        <span id="combo">连击 0</span>
        <span id="chain">门链 x0</span>
      </div>
      <div id="targetLabel">目标 6,000</div>
      <div id="targetWrap"><div id="targetBar"></div></div>
    </div>
    <div class="hud-right">
      <div id="throwLabel">第 1/3 壶</div>
      <div id="bestLabel">最高 0</div>
      <div class="hud-btns">
        <button id="restartBtn" class="restart-btn" aria-label="重开本局">↻ 重开</button>
        <button id="muteBtn" class="icon-btn" aria-label="声音开关">🔊</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="bottom">
    <div id="hint">按住蓄力，左右拖动瞄准</div>
    <div id="ballBar" class="ball-bar hidden"></div>
    <div id="staminaWrap"><div id="stamina"></div></div>
    <div id="spinBar">
      <button class="spin-btn" data-spin="-1">左旋</button>
      <button class="spin-btn active" data-spin="0">直</button>
      <button class="spin-btn" data-spin="1">右旋</button>
    </div>
  </div>

  <div id="overlay" class="show">
    <div class="card">
      <div class="badge">10 秒原型</div>
      <h1>冰壶大作战</h1>
      <p class="tagline">吃门变强 · 分裂清屏 · 一壶爆分</p>
      <div class="how">
        <div><b>1</b> 按住蓄力，左右拖动瞄准</div>
        <div><b>2</b> 松手投掷，满力显示 MAX</div>
        <div><b>3</b> 滑行时按住屏幕擦冰</div>
        <div><b>4</b> 连续命中门叠倍率 · 右上角随时重开</div>
      </div>
      <div id="resultStats" class="result-stats hidden"></div>
      <button id="startBtn" class="primary">爽快模式</button>
      <button id="towerBtn" class="secondary">爬塔模式</button>
      <button id="homeBtn" class="secondary hidden">回主页</button>
      <p id="footnote" class="footnote">3 壶 · 目标 6,000 · 3 星 10,000</p>
    </div>
  </div>

  <div id="towerOverlay" class="hidden">
    <div class="card tower-card">
      <div class="badge" id="towerBadge">爬塔模式</div>
      <h1 id="towerTitle">第 1 层突破</h1>
      <p id="towerSub" class="tagline">伤害 0 / 防御 0</p>
      <div id="towerBalls" class="ball-grid"></div>
      <p id="towerTip" class="tower-tip">选择一颗冰球强化</p>
      <div id="towerAtk" class="tower-atk">攻击加成 +0%</div>
      <button id="towerNextBtn" class="primary">进入下一层</button>
      <button id="towerRetryBtn" class="primary hidden">重试本层</button>
      <button id="towerEndBtn" class="secondary hidden">回主页</button>
    </div>
  </div>

</div>
<script>
(() => {
  'use strict';

  // =========================================================================
  // DOM
  // =========================================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const multEl = document.getElementById('mult');
  const comboEl = document.getElementById('combo');
  const chainEl = document.getElementById('chain');
  const targetLabelEl = document.getElementById('targetLabel');
  const targetBarEl = document.getElementById('targetBar');
  const throwEl = document.getElementById('throwLabel');
  const bestEl = document.getElementById('bestLabel');
  const toastEl = document.getElementById('toast');
  const staminaEl = document.getElementById('stamina');
  const staminaWrap = document.getElementById('staminaWrap');
  const hintEl = document.getElementById('hint');
  const overlayEl = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const towerBtn = document.getElementById('towerBtn');
  const homeBtn = document.getElementById('homeBtn');
  const footnoteEl = document.getElementById('footnote');
  const towerOverlay = document.getElementById('towerOverlay');
  const towerBadge = document.getElementById('towerBadge');
  const towerTitle = document.getElementById('towerTitle');
  const towerSub = document.getElementById('towerSub');
  const towerBalls = document.getElementById('towerBalls');
  const towerTip = document.getElementById('towerTip');
  const towerAtk = document.getElementById('towerAtk');
  const towerNextBtn = document.getElementById('towerNextBtn');
  const towerRetryBtn = document.getElementById('towerRetryBtn');
  const towerEndBtn = document.getElementById('towerEndBtn');
  const resultStatsEl = document.getElementById('resultStats');
  const restartBtn = document.getElementById('restartBtn');
  const ballBar = document.getElementById('ballBar');
  const muteBtn = document.getElementById('muteBtn');

  // =========================================================================
  // Constants
  // =========================================================================
  const WORLD = {
    halfWidth: 2.375,
    length: 36,
    releaseY: 6.0,
    houseY: 30,
    houseR: 1.83
  };
  const R0 = 0.16;
  const PIN_R = 0.12;
  const FIXED = 1 / 60;
  const MAX_STONES = 12;
  const SIZE_MAX = 3.0;
  const SIZE_MIN = 0.55;
  const SPEED_MAX = 13;
  const GATE_MULT_MAX = 5;
  const COMBO_MULT_MAX = 6;
  const TOTAL_MULT_MAX = 20;
  const SLIDE_TIME_SCALE = 1.15;
  const CURL_ACCEL = 0.26;
  const CHARGE_TIME = 1.05;
  const CHARGE_MIN = 0.08;
  const AIM_DRAG_PX = 110;
  const TARGET_SCORE = 6000;
  const THREE_STAR_SCORE = 10000;
  const BEST_KEY = 'curling-gates-best-v1';
  const SPIN_KEY = 'curling-gates-spin-v1';
  const TOWER_BEST_KEY = 'curling-gates-tower-best-v1';
  const TOWER_BASE_DEF = 2000;
  const TOWER_DEF_GROWTH = 1.55;

  const BALL_TYPES = {

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  // =========================================================================
  // Canvas / projection
  // =========================================================================
  let W = 0;
  let H = 0;
  let DPR = 1;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initSnow();
  }

  function ppmAt(y) {
    return (W * 1.02 / (WORLD.halfWidth * 2)) / (1 + 0.028 * y);
  }

  function project(x, y) {
    const horizon = H * 0.08;
    const t = clamp(y / WORLD.length, 0, 1.05);
    const sy = H - (H - horizon) * Math.pow(t, 0.92);
    const ppm = ppmAt(y);
    const sx = W / 2 + x * ppm;
    return { sx, sy, ppm, scale: ppm / (W * 1.02 / (WORLD.halfWidth * 2)) };
  }

  // =========================================================================
  // Audio
  // =========================================================================
  const AudioFX = (() => {
    let ac = null;
    let master = null;
    let muted = false;
    let noiseBuf = null;

    function init() {
      if (ac) {
        if (ac.state === 'suspended') ac.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.16;
      master.connect(ac.destination);
      const len = Math.floor(ac.sampleRate * 0.5);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }

    function tone(freq, dur, type, vol, slideTo, delay) {
      if (!ac || muted) return;
      const t0 = ac.currentTime + (delay || 0);
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(Math.max(20, freq), t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol || 0.2), t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(master);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    }

    function noise(dur, vol, filterFreq, delay) {
      if (!ac || muted || !noiseBuf) return;
      const t0 = ac.currentTime + (delay || 0);
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = filterFreq || 1200;
      const g = ac.createGain();
      g.gain.setValueAtTime(Math.max(0.0001, vol || 0.2), t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f);
      f.connect(g);
      g.connect(master);
      src.start(t0);
      src.stop(t0 + dur + 0.03);
    }

    return {
      init,
      setMuted(v) { muted = v; },
      isMuted() { return muted; },
      throwStone() {
        noise(0.18, 0.22, 900);
        tone(180, 0.12, 'sine', 0.12, 120);
      },
      gate() {
        tone(660, 0.09, 'triangle', 0.22);
        tone(990, 0.12, 'triangle', 0.18, null, 0.06);
      },
      perfect() {
        tone(880, 0.08, 'square', 0.14);
        tone(1320, 0.14, 'square', 0.12, null, 0.05);
      },
      impact(strength, combo) {
        const s = clamp(strength || 1, 0.3, 2);
        const p = Math.min(20, combo || 0);
        noise(0.09 * s, 0.3 * s, 1600 + p * 30);
        tone(110 + p * 6, 0.12, 'sine', 0.26 * s, 60 + p * 3);
      },
      split() {
        tone(440, 0.06, 'square', 0.16);
        tone(550, 0.06, 'square', 0.14, null, 0.05);
        tone(660, 0.08, 'square', 0.12, null, 0.1);
      },
      sweep() {
        noise(0.08, 0.1, 2600);
      },
      charge(stage) {
        tone(280 + stage * 150, 0.05, 'square', 0.1);
        if (stage >= 4) tone(1200, 0.08, 'triangle', 0.12);
      },
      clear() {
        [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, 'triangle', 0.2, null, i * 0.07));
      },
      win() {
        [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.26, 'triangle', 0.18, null, i * 0.09));
      },
      fail() {
        tone(220, 0.2, 'sawtooth', 0.12, 110);
      }
    };
  })();

  // =========================================================================
  // Level builders
  // =========================================================================
  function makeStone(x, y, opts) {
    const o = opts || {};
    const r = o.r == null ? R0 : o.r;
    return {
      x,
      y,
      vx: o.vx || 0,
      vy: o.vy || 0,
      r,
      mass: (r / R0) * (r / R0),
      friction: o.friction == null ? 1.55 : o.friction,
      spin: o.spin || 0,
      magnetTimer: o.magnetTimer || 0,
      magnetRadius: o.magnetRadius || 2.6,
      pierce: o.pierce || 0,
      shield: !!o.shield,
      alive: true,
      active: !!o.active,
      ballId: o.ballId || null,
      ballLevel: o.ballLevel || 1,
      ballColor: o.ballColor || null,
      ballSplitUsed: false,
      trail: []
    };
  }

  function makePin(x, y) {
    return {
      x,
      y,
      r: PIN_R,
      hit: false,
      vx: 0,
      vy: 0,
      life: 1,
      moving: false
    };
  }

  function buildPins() {
    const pins = [];
    const rows = [
      { dy: -2.1, n: 3 },
      { dy: -1.4, n: 4 },
      { dy: -0.7, n: 5 },
      { dy: 0.0, n: 6 },
      { dy: 0.7, n: 5 },
      { dy: 1.4, n: 4 },
      { dy: 2.1, n: 3 }
    ];
    const gap = 0.55;
    for (const row of rows) {
      for (let i = 0; i < row.n; i++) {
        const x = (i - (row.n - 1) / 2) * gap;
        pins.push(makePin(x, WORLD.houseY + row.dy));
      }
    }
    return pins;
  }

  // =========================================================================
  // Scoring
  // =========================================================================
  function totalMult() {
    const comboMult = Math.min(COMBO_MULT_MAX, game.combo * 0.1);
    const chainMult = Math.min(2, Math.max(0, game.gateChain - 1) * 0.5);
    const val = Math.min(TOTAL_MULT_MAX, 1 + game.gateMult + comboMult + chainMult);
    if (val > game.maxMult) game.maxMult = val;
    if (val > game.throwMaxMult) game.throwMaxMult = val;
    return val;
  }

  function starsFor(score) {
    if (score >= THREE_STAR_SCORE) return 3;
    if (score >= TARGET_SCORE) return 2;
    if (score >= TARGET_SCORE / 2) return 1;
    return 0;
  }

  function getSelectedBall() {
    const t = game.tower;
    return t.balls[Math.max(0, Math.min(t.balls.length - 1, t.selectedBall))] || t.balls[0];
  }

  function ballType(ball) {
    return BALL_TYPES[ball.id] || BALL_TYPES.standard;
  }

  function ballPower(ball) {
    return 1 + 0.18 * (ball.level - 1) + ballType(ball).atk;
  }

  function ballRadius(ball) {
    return R0 * ballType(ball).radius * (1 + 0.05 * (ball.level - 1));
  }

  function ballSpinMult(ball) {
    return ball.id === 'curl' ? 1.6 + 0.12 * (ball.level - 1) : 1;
  }

  function towerAtkBonus() {
    return ballPower(getSelectedBall()) - 1;
  }

  function haptic(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) {
      /* ignore */
    }
  }

  // =========================================================================
  // FX
  // =========================================================================
  function burst(x, y, color, count, speed) {
    const n = count || 10;
    const sp = speed || 0.8;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const v = (0.5 + Math.random()) * sp;
      game.particles.push({
        type: 'dot',
        x,
        y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 0.45 + Math.random() * 0.35,
        maxLife: 0.8,
        size: 0.02 + Math.random() * 0.05,
        color
      });
    }
  }

  function ring(x, y, color) {
    game.particles.push({
      type: 'ring',
      x,
      y,
      vx: 0,
      vy: 0,
      life: 0.7,
      maxLife: 0.7,
      size: 0.4,
      color
    });
  }

    if (game.cleared) return;
    game.cleared = true;
    game.slowTimer = 0.55;

  // =========================================================================
  // Game flow
  // =========================================================================
  function startGame(mode) {
    AudioFX.init();
    const nextMode = mode || game.mode || 'quick';
    game.mode = nextMode;
    overlayEl.classList.remove('show');
    overlayEl.style.display = 'none';
    overlayEl.classList.remove('result');
    resultStatsEl.classList.add('hidden');
    towerOverlay.classList.add('hidden');

    if (nextMode === 'tower') {
      startTower();
    } else {
      startQuick();
    }
  }

  function resetRunBase() {
    game.score = 0;
    game.displayScore = 0;
    game.throwIndex = 0;
    game.runHitPins = 0;
    game.throwScores = [];
    game.gateMult = 0;
    game.combo = 0;
    game.maxMult = 1;
    game.maxCombo = 0;
    game.maxChain = 0;
    game.gateChain = 0;
    game.cleared = false;
    game.best = loadBest();

  function startQuick() {
    resetRunBase();
    game.targetScore = TARGET_SCORE;
    game.runTotalPins = 3 * buildPins().length;
    startThrow();

  function startTower() {
    resetRunBase();
    const t = game.tower;
    t.floor = 1;
    t.def = TOWER_BASE_DEF;
    t.hearts = 3;
    t.floorDamage = 0;
    t.bestFloor = loadTowerBest();
    t.balls = [
      { id: 'standard', level: 1 },
      { id: 'giant', level: 1 },
      { id: 'curl', level: 1 },
      { id: 'split', level: 1 }
    ];
    t.selectedBall = 0;
    t.upgraded = false;
    game.targetScore = TOWER_BASE_DEF;
    game.runTotalPins = 0;
    startThrow();
  }

  function startThrow() {
    game.phase = 'aim';
    game.throwsTotal = 3;
    game.targetScore = game.mode === 'tower' ? game.tower.def : TARGET_SCORE;
    game.throwStartScore = game.score;
    game.throwMaxMult = 1;
    const selected = game.mode === 'tower' ? getSelectedBall() : null;
    const selectedType = selected ? ballType(selected) : null;
    game.stones = [
      makeStone(0, WORLD.releaseY, selected ? {
        r: ballRadius(selected),
        ballId: selected.id,
        ballLevel: selected.level,
        ballColor: selectedType.color
      } : {})
    ];
    game.gates = buildGates();
    game.pins = buildPins();
    game.totalPins = game.pins.length;
    game.hitPins = 0;
    game.combo = 0;
    game.comboTimer = 0;
    game.gateMult = 0;
    game.gateChain = 0;
    game.bigMoment = false;
    game.waveMoment = false;
    game.hitStop = 0;
    game.cleared = false;
    game.aim.charging = false;
    game.aim.chargeTime = 0;
    game.aim.chargeStage = 0;
    game.aim.maxed = false;
    game.aim.power = 0;
    game.aim.angle = 0;
    setSpinUI();
    game.sweeping = false;
    game.stamina = 1;
    game.sweepSfxTimer = 0;
    game.settleTimer = 0.3;
    game.betweenTimer = 0;
    game.particles = [];
    game.popups = [];
    toastEl.classList.remove('show');
    renderBallBar();
    updateHUD();
  }

  function doThrow() {
    const s = game.stones[0];
    if (!s || !s.alive) return;
    const power = clamp(game.aim.power, 0, 1);
    if (power < CHARGE_MIN) return;
    const speed = 4.5 + power * 7.0;
    s.vx = Math.sin(game.aim.angle) * speed;
    s.vy = Math.cos(game.aim.angle) * speed;
    s.spin =
      game.spin *
      (game.mode === 'tower' ? ballSpinMult(getSelectedBall()) : 1);
    s.active = true;
    game.phase = 'slide';
    game.aim.charging = false;
    game.aim.power = 0;
    game.settleTimer = 0.3;
    game.sweeping = false;
    renderBallBar();
    AudioFX.throwStone();
  }

  function finishThrow() {
    if (game.phase !== 'slide') return;
    scoreHouse();
    let clearBonus = 0;
    if (game.totalPins > 0 && game.hitPins >= game.totalPins) {
      clearBonus = 800 * Math.max(1, game.throwMaxMult);
      game.score += clearBonus;
      addPopup(0, WORLD.houseY - 1, '清屏奖励 +' + Math.round(clearBonus), '#ffd34d', 1.4);
    }
    const gained = Math.round(game.score - game.throwStartScore);
    game.throwScores.push(gained);
    game.lastThrowScore = gained;
    game.phase = 'between';
    game.settleTimer = 0;
    game.betweenTimer = 1.0;
    game.sweeping = false;
    renderBallBar();

    if (game.mode === 'tower') {
      const damage = Math.round(gained * (1 + towerAtkBonus()));
      game.tower.floorDamage += damage;
      game.throwStartScore = game.score;
      showToast('第 ' + (game.throwIndex + 1) + ' 壶 +' + fmt(damage) + ' 伤害', 900);
    } else {
      showToast('第 ' + (game.throwIndex + 1) + ' 壶 +' + fmt(gained) + (clearBonus ? ' · 清屏!' : ''), 900);
    }
  }

  function nextThrow() {
    if (game.mode === 'tower') {
      game.throwIndex += 1;
      if (game.throwIndex >= game.throwsTotal) {
        resolveTowerFloor();
        return;
      }
      startThrow();
      return;
    }

    game.throwIndex += 1;
    if (game.throwIndex >= game.throwsTotal) {
      showResult();
      return;
    }
    startThrow();
  }

  function resolveTowerFloor() {
    const t = game.tower;
    if (t.floorDamage >= t.def) {
      t.bestFloor = Math.max(t.bestFloor, t.floor);
      saveTowerBest(t.bestFloor);
      AudioFX.win();
      haptic([20, 30, 40]);
      showTowerClear();
      return;
    }

    t.hearts = Math.max(0, t.hearts - 1);
    if (t.hearts <= 0) {
      t.bestFloor = Math.max(t.bestFloor, t.floor - 1);
      saveTowerBest(t.bestFloor);
      AudioFX.fail();
      showResult();
      return;
    }
    AudioFX.fail();
    haptic(20);
    showTowerFail();
  }

  function showTowerClear() {
    const t = game.tower;
    game.phase = 'towerClear';
    towerOverlay.classList.remove('hidden');
    towerBadge.textContent = '第 ' + t.floor + ' 层突破';
    towerTitle.textContent = '选择一颗冰球强化';
    towerSub.textContent = '伤害 ' + fmt(t.floorDamage) + ' / 防御 ' + fmt(t.def);
    towerBalls.classList.remove('hidden');
    towerTip.classList.remove('hidden');
    towerAtk.classList.remove('hidden');
    towerNextBtn.classList.remove('hidden');
    towerNextBtn.textContent = '进入第 ' + (t.floor + 1) + ' 层';
    towerNextBtn.disabled = true;
    towerRetryBtn.classList.add('hidden');
    towerEndBtn.classList.add('hidden');
    t.upgraded = false;
    renderTowerBalls();
    updateTowerAtkLabel();
  }

  function showTowerFail() {
    const t = game.tower;
    game.phase = 'towerFail';
    towerOverlay.classList.remove('hidden');

      const type = ballType(ball);
      const btn = document.createElement('button');
      btn.type = 'button';

  function upgradeBall(i) {
    const t = game.tower;
    if (t.upgraded) return;
    t.upgraded = true;
    t.selectedBall = i;
    t.balls[i].level += 1;

    const t = game.tower;
    ballBar.innerHTML = '';

      ballBar.classList.add('hidden');
      return;
    }
    ballBar.classList.remove('hidden');
    t.balls.forEach((ball, i) => {
      const type = ballType(ball);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ball-chip';
      if (i === t.selectedBall) btn.classList.add('selected');

      btn.innerHTML =

        ball.level +
        '</span>';

      btn.addEventListener('click', () => selectBall(i));

  function selectBall(i) {
    const t = game.tower;
    if (game.mode !== 'tower' || game.phase !== 'aim') return;
    t.selectedBall = i;
    const s = game.stones[0];
    if (s) {
      const ball = t.balls[i];
      const type = ballType(ball);
      s.r = ballRadius(ball);
      s.mass = (s.r / R0) * (s.r / R0);
      s.ballId = ball.id;
      s.ballLevel = ball.level;
      s.ballColor = type.color;

    AudioFX.gate();
    haptic(8);
    renderBallBar();
    updateHUD();

    towerAtk.textContent =
      '当前：' +
      type.name +
      ' Lv.' +
      ball.level +
      ' · 攻击 +' +
      Math.round((ballPower(ball) - 1) * 100) +

    const t = game.tower;
    if (!t.upgraded) return;
    towerOverlay.classList.add('hidden');
    t.floor += 1;
    t.def = Math.round(t.def * TOWER_DEF_GROWTH);
    t.floorDamage = 0;
    t.upgraded = false;
    game.throwIndex = 0;
    game.throwScores = [];
    game.phase = 'aim';
    startThrow();

    const t = game.tower;
    towerOverlay.classList.add('hidden');

    t.upgraded = false;
    game.throwIndex = 0;
    game.throwScores = [];
    game.phase = 'aim';
    startThrow();

    resultStatsEl.classList.remove('hidden');
    homeBtn.classList.remove('hidden');
    towerBtn.classList.add('hidden');
    ballBar.classList.add('hidden');

    if (game.mode === 'tower') {
      const t = game.tower;
      startBtn.textContent = '重新爬塔';
      footnoteEl.textContent = '爬塔模式 · 最高第 ' + t.bestFloor + ' 层';
      resultStatsEl.innerHTML =
        '<div class="rs-row"><span>到达层数</span><b>第 ' + t.floor + ' 层</b></div>' +
        '<div class="rs-row"><span>最高层数</span><b>第 ' + t.bestFloor + ' 层</b></div>' +
        '<div class="rs-row"><span>剩余心数</span><b>' + '❤'.repeat(Math.max(0, t.hearts)) + '</b></div>' +

        '<div class="rs-row"><span>最高冰球</span><b>Lv.' + Math.max(...t.balls.map((b) => b.level)) + '</b></div>' +

      AudioFX.fail();
      haptic(20);
      return;
    }

    const score = Math.round(game.score);
    if (score > game.best) {
      game.best = score;
      saveBest(score);
    }
    startBtn.textContent = '再来一局';
    footnoteEl.textContent = '3 壶 · 目标 6,000 · 3 星 10,000';
    const stars = starsFor(score);
    const starText = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    let hint;
    if (score >= THREE_STAR_SCORE) hint = '三星达成，漂亮！';
    else if (score >= game.targetScore) hint = '二星达成，再冲 ' + fmt(THREE_STAR_SCORE);
    else hint = '距离目标还差 ' + fmt(game.targetScore - score) + ' 分';

    const rows = game.throwScores
      .map((s, i) => '<span>第' + (i + 1) + '壶 ' + fmt(s) + '</span>')
      .join('');
    resultStatsEl.innerHTML =
      '<div class="rs-stars">' + starText + '</div>' +
      '<div class="rs-row"><span>本局得分</span><b>' + fmt(score) + '</b></div>' +
      '<div class="rs-row"><span>最高分</span><b>' + fmt(game.best) + '</b></div>' +
      '<div class="rs-row"><span>最高倍率</span><b>×' + game.maxMult.toFixed(1) + '</b></div>' +
      '<div class="rs-row"><span>最高连击</span><b>' + game.maxCombo + '</b></div>' +
      '<div class="rs-row"><span>最高门链</span><b>x' + game.maxChain + '</b></div>' +
      '<div class="rs-row"><span>命中钉子</span><b>' + game.runHitPins + '/' + game.runTotalPins + '</b></div>' +
      '<div class="rs-hint">' + hint + '</div>' +
      '<div class="rs-throws">' + rows + '</div>';
    if (stars > 0) {
      AudioFX.win();
    } else {
      AudioFX.fail();
    }
    haptic(stars > 0 ? [15, 40, 20] : 20);

  // =========================================================================
  // Input
  // =========================================================================
  function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function updateAimAngle() {
    const dx = game.aim.curX - game.aim.startX;
    game.aim.angle = clamp(-(dx / AIM_DRAG_PX) * 0.55, -0.55, 0.55);
  }

  function setSpin(v) {
    game.spin = v;
    saveSpin(v);
    setSpinUI();
  }

  function setSpinUI() {
    document.querySelectorAll('.spin-btn').forEach((b) => {
      b.classList.toggle('active', Number(b.dataset.spin) === game.spin);
    });
  }

  canvas.addEventListener('pointerdown', (e) => {
    AudioFX.init();
    if (game.phase === 'between') {
      nextThrow();
      return;
    }
    if (game.phase === 'aim') {
      if (game.aim.charging) return;
      const p = getPointerPos(e);
      game.aim.charging = true;
      game.aim.chargeTime = 0;
      game.aim.chargeStage = 0;
      game.aim.maxed = false;
      game.aim.startX = p.x;
      game.aim.curX = p.x;
      game.aim.power = 0;
      game.aim.angle = 0;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    } else if (game.phase === 'slide') {
      game.sweeping = true;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (game.phase === 'aim' && game.aim.charging) {
      const p = getPointerPos(e);
      game.aim.curX = p.x;
      updateAimAngle();
    }
  });

  function endPointer() {
    if (game.phase === 'aim' && game.aim.charging) {
      game.aim.charging = false;
      if (game.aim.chargeTime >= 0.08 && game.aim.power >= CHARGE_MIN) {
        doThrow();
      } else {
        game.aim.power = 0;
        showToast('按住蓄力再松手', 700);
      }
    }
    if (game.phase === 'slide') {
      game.sweeping = false;
    }
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', () => {
    game.aim.charging = false;
    game.aim.power = 0;
    game.sweeping = false;
  });

  document.querySelectorAll('.spin-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      AudioFX.init();
      setSpin(Number(btn.dataset.spin));
    });
  });

  startBtn.addEventListener('click', () => {
    AudioFX.init();
    startGame(game.mode === 'tower' ? 'tower' : 'quick');
  });

  towerBtn.addEventListener('click', () => {
    AudioFX.init();
    startGame('tower');
  });

  homeBtn.addEventListener('click', () => {

  towerNextBtn.addEventListener('click', () => {
