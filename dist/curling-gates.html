<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>冰壶大作战 · 10 秒原型</title>
<style>
:root {
  --bg: #050b18;
  --panel: rgba(9, 22, 42, 0.72);
  --cyan: #5fe3ff;
  --cyan-strong: #38c8f0;
  --gold: #ffd34d;
  --text: #eaf7ff;
  --muted: #8fb3cc;
  --red: #ff5d6c;
  --green: #39e58c;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: var(--bg);
  overflow: hidden;
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  justify-content: center;
  align-items: stretch;
}

#app {
  position: relative;
  width: min(100vw, 520px);
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #12345a 0%, #071226 55%, #040913 100%);
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#app::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 25%, rgba(0, 0, 0, 0.55) 100%);
}

/* ---------- HUD ---------- */

#hud {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding: calc(14px + env(safe-area-inset-top)) 18px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 2;
}

.score-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
}

#score {
  font-size: 34px;
  font-weight: 800;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 18px rgba(95, 227, 255, 0.35);
}

.sub-row {
  display: flex;
  gap: 8px;
  margin-top: 2px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

#mult {
  color: var(--gold);
  font-weight: 800;
}

#combo {
  color: var(--cyan);
}

#chain {
  color: var(--gold);
  font-weight: 700;
}

#targetLabel {
  margin-top: 5px;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

#targetWrap {
  width: 150px;
  height: 4px;
  margin-top: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

#targetBar {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #5fe3ff, #ffd34d);
  transition: width 0.12s linear;
}

.hud-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  font-size: 11px;
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.hud-btns {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}

.restart-btn {
  pointer-events: auto;
  height: 34px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(120, 200, 255, 0.25);
  background: rgba(10, 30, 55, 0.62);
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  backdrop-filter: blur(6px);
  white-space: nowrap;
}

.restart-btn:active {
  transform: scale(0.95);
  background: rgba(95, 227, 255, 0.18);
}

#throwLabel {
  color: var(--text);
  font-weight: 700;
  font-size: 12px;
}

.icon-btn {
  pointer-events: auto;
  margin-top: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(120, 200, 255, 0.25);
  background: rgba(10, 30, 55, 0.62);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
}

.icon-btn:active {
  transform: scale(0.94);
}

/* ---------- Toast ---------- */

#toast {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translate(-50%, -8px);
  padding: 10px 16px;
  border-radius: 999px;
  background: rgba(5, 18, 36, 0.84);
  border: 1px solid rgba(95, 227, 255, 0.35);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.22s ease, transform 0.22s ease;
  pointer-events: none;
  z-index: 3;
  white-space: nowrap;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- Bottom controls ---------- */

#bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0 18px calc(14px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 2;
  pointer-events: none;
}

#hint {
  text-align: center;
  font-size: 11px;
  color: rgba(200, 230, 255, 0.72);
  min-height: 14px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
}



#spinBar {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.spin-btn {
  flex: 1;
  height: 40px;
  border-radius: 14px;
  border: 1px solid rgba(120, 200, 255, 0.22);
  background: rgba(8, 24, 45, 0.72);
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
}

.spin-btn:active {
  transform: scale(0.97);
}

.spin-btn.active {
  color: #04121f;
  background: linear-gradient(180deg, #8ef2ff, #38c8f0);
  border-color: transparent;
  box-shadow: 0 0 18px rgba(95, 227, 255, 0.35);
}

/* ---------- Overlay ---------- */

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(3, 9, 20, 0.56);
  backdrop-filter: blur(10px);
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

#overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.card {
  width: 100%;
  max-width: 360px;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 24px 22px 20px;
  border-radius: 26px;
  background: linear-gradient(160deg, rgba(18, 44, 78, 0.96), rgba(6, 18, 36, 0.97));
  border: 1px solid rgba(120, 200, 255, 0.22);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #8ef2ff;
  background: rgba(95, 227, 255, 0.1);
  border: 1px solid rgba(95, 227, 255, 0.25);
}

.card h1 {
  margin: 12px 0 4px;
  font-size: 30px;
  letter-spacing: 0.04em;
}

.tagline {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 12px;
}

.how {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0 0 18px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 12px;
  color: #cfe9ff;
}

.how b {
  display: inline-flex;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(95, 227, 255, 0.16);
  color: #8ef2ff;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  margin-right: 8px;
}

.primary {
  width: 100%;
  height: 52px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(180deg, #9af4ff, #37c8f0);
  color: #04121f;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  letter-spacing: 0.08em;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(56, 200, 240, 0.35);
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}

.primary:active {
  transform: translateY(1px) scale(0.99);
  box-shadow: 0 6px 18px rgba(56, 200, 240, 0.3);
}

.primary:disabled {
  opacity: 0.45;
  cursor: default;
  box-shadow: none;
}

.secondary {
  width: 100%;
  height: 44px;
  margin-top: 8px;
  border: 1px solid rgba(120, 200, 255, 0.25);
  border-radius: 14px;
  background: rgba(10, 30, 55, 0.6);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 0.04em;
}

.secondary:active {
  transform: scale(0.98);
  background: rgba(95, 227, 255, 0.12);
}

#levelSelect {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(3, 9, 20, 0.66);
  backdrop-filter: blur(10px);
  z-index: 7;
}

.level-card {
  max-width: 360px;
}

.level-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin: 12px 0 14px;
}

.level-btn {
  position: relative;
  min-height: 90px;
  padding: 11px 10px 9px;
  border-radius: 16px;
  border: 1px solid rgba(120, 200, 255, 0.28);
  background: rgba(10, 30, 56, 0.78);
  color: var(--text);
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  overflow: hidden;
}

.level-btn b {
  display: block;
  margin: 2px 0 3px;
  font-size: 15px;
}

.level-num {
  display: block;
  color: #5fe3ff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.level-goal {
  display: block;
  color: #ffd34d;
  font-size: 11px;
  font-weight: 700;
}

.level-state {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
}

.level-btn.cleared {
  border-color: rgba(57, 229, 140, 0.55);
  background: rgba(18, 58, 52, 0.72);
}

.level-btn.locked {
  opacity: 0.38;
  cursor: not-allowed;
  filter: grayscale(0.6);
}

#towerOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(3, 9, 20, 0.66);
  backdrop-filter: blur(10px);
  z-index: 6;
}

.tower-card {
  max-width: 360px;
}

.stone-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0 8px;
}

.stone-btn {
  height: 52px;
  border-radius: 14px;
  border: 1px solid rgba(120, 200, 255, 0.3);
  background: rgba(95, 227, 255, 0.08);
  color: var(--text);
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
}

.stone-btn .lvl {
  display: block;
  font-size: 9px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 1px;
}

.stone-btn.selected {
  border-color: var(--gold);
  background: rgba(255, 211, 77, 0.14);
  box-shadow: 0 0 16px rgba(255, 211, 77, 0.3);
}

.stone-btn.empty {
  border-style: dashed;
  opacity: 0.25;
  cursor: default;
}

.tower-atk {
  text-align: center;
  font-size: 12px;
  color: var(--gold);
  font-weight: 700;
  margin: 6px 0 10px;
}

.tower-tip {
  margin: 0 0 4px;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
}

.rune-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.rune-btn {
  min-height: 38px;
  padding: 6px 10px;
  border-radius: 12px;
  border: 1px solid rgba(120, 200, 255, 0.22);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}

.rune-btn.chosen {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(255, 211, 77, 0.1);
}

.ball-bar {
  display: flex;
  gap: 6px;
  justify-content: flex-start;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 2px;
  scrollbar-width: none;
  pointer-events: auto;
}

.ball-bar::-webkit-scrollbar {
  display: none;
}

.ball-chip {
  flex: 0 0 66px;
  min-width: 0;
  height: 38px;
  padding: 4px 4px;
  border-radius: 12px;
  border: 1px solid rgba(120, 200, 255, 0.22);
  background: rgba(8, 24, 45, 0.72);
  color: var(--muted);
  font-family: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}

.ball-chip .ball-name {
  font-size: 10px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}

.ball-chip .ball-lv {
  font-size: 9px;
  color: var(--muted);
}

.ball-chip.selected {
  border-color: var(--gold);
  background: rgba(255, 211, 77, 0.14);
  box-shadow: 0 0 14px rgba(255, 211, 77, 0.25);
}

.ball-chip:disabled {
  opacity: 0.5;
  cursor: default;
}

.ball-chip.used {
  opacity: 0.32;
  text-decoration: line-through;
}

.ball-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 10px 0 8px;
}

.ball-card {
  padding: 9px 8px;
  border-radius: 14px;
  border: 1px solid rgba(120, 200, 255, 0.3);
  background: rgba(95, 227, 255, 0.07);
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.ball-card b {
  display: block;
  font-size: 13px;
}

.ball-card .ball-meta {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  color: var(--gold);
}

.ball-card .ball-desc {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  color: var(--muted);
  line-height: 1.3;
}

.ball-card.selected {
  border-color: var(--gold);
  background: rgba(255, 211, 77, 0.13);
  box-shadow: 0 0 16px rgba(255, 211, 77, 0.26);
}

.ball-card:disabled {
  opacity: 0.45;
  cursor: default;
}

.footnote {
  margin: 12px 0 0;
  font-size: 10px;
  color: rgba(160, 200, 230, 0.55);
}

.result-stats {
  margin: 0 0 16px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rs-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  color: var(--muted);
}

.rs-row b {
  color: var(--text);
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}

.rs-throws {
  display: flex;
  gap: 6px;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 10px;
  color: rgba(160, 200, 230, 0.72);
  font-variant-numeric: tabular-nums;
}

.rs-stars {
  text-align: center;
  font-size: 30px;
  letter-spacing: 6px;
  color: var(--gold);
  line-height: 1;
  margin: 2px 0 6px;
  text-shadow: 0 0 18px rgba(255, 211, 77, 0.35);
}

.rs-hint {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.hidden {
  display: none !important;
}

#overlay.result .how {
  display: none;
}

@media (min-width: 521px) {
  #app {
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.6);
  }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="冰壶大作战游戏画面"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div class="score-label">得分</div>
      <div id="score">0</div>
      <div class="sub-row">
        <span id="mult">×1.0</span>
        <span id="combo">连击 0</span>
        <span id="chain">门链 x0</span>
      </div>
      <div id="targetLabel">目标 6,000</div>
      <div id="targetWrap"><div id="targetBar"></div></div>
    </div>
    <div class="hud-right">
      <div id="throwLabel">第 1/3 壶</div>
      <div id="bestLabel">最高 0</div>
      <div class="hud-btns">
        <button id="levelBtn" class="restart-btn hidden" aria-label="选择关卡">选关</button>
        <button id="restartBtn" class="restart-btn" aria-label="重开本局">↻ 重开</button>
        <button id="muteBtn" class="icon-btn" aria-label="声音开关">🔊</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="bottom">
    <div id="hint">按住瞄准，手指指向目标</div>
    <div id="ballBar" class="ball-bar hidden"></div>
    <div id="spinBar">
      <button class="spin-btn" data-spin="-1">左旋</button>
      <button class="spin-btn active" data-spin="0">直</button>
      <button class="spin-btn" data-spin="1">右旋</button>
    </div>
  </div>

  <div id="overlay" class="show">
    <div class="card">
      <div class="badge">10 关闯关</div>
      <h1>冰壶大作战</h1>
      <p class="tagline">10 关独立关卡 · 逐关解锁 · 吃门变强</p>
      <div class="how">
        <div><b>1</b> 按住瞄准，手指指向目标</div>
        <div><b>2</b> 松手投掷，始终满力</div>
        <div><b>3</b> 每关目标不同：伤害 / 钉子 / 门</div>
        <div><b>4</b> 每关独立配球，通关解锁下一关</div>
      </div>
      <div id="resultStats" class="result-stats hidden"></div>
      <button id="startBtn" class="primary">闯关模式</button>
      <button id="shareBtn" class="secondary hidden">分享成绩</button>
      <button id="towerBtn" class="secondary">爬塔模式</button>
      <button id="homeBtn" class="secondary hidden">回主页</button>
      <p id="footnote" class="footnote">10 关 · 逐关解锁 · 每关独立</p>
    </div>
  </div>

  <div id="levelSelect" class="hidden">
    <div class="card level-card">
      <div class="badge">10 关闯关</div>
      <h1>选择关卡</h1>
      <p class="tagline">逐关解锁 · 每关独立配球 · 不继承升级</p>
      <div id="levelGrid" class="level-grid"></div>
      <button id="levelBackBtn" class="secondary">返回主菜单</button>
    </div>
  </div>

  <div id="towerOverlay" class="hidden">
    <div class="card tower-card">
      <div class="badge" id="towerBadge">爬塔模式</div>
      <h1 id="towerTitle">第 1 层突破</h1>
      <p id="towerSub" class="tagline">伤害 0 / 防御 0</p>
      <div id="towerBalls" class="ball-grid"></div>
      <p id="towerTip" class="tower-tip">选择 1 个：新冰球 / 强化现有冰球</p>
      <div id="towerAtk" class="tower-atk">攻击加成 +0%</div>
      <button id="towerNextBtn" class="primary">进入下一层</button>
      <button id="towerRetryBtn" class="primary hidden">重试本层</button>
      <button id="towerEndBtn" class="secondary hidden">回主页</button>
    </div>
  </div>

</div>
<script>
(() => {
  'use strict';

  // =========================================================================
  // DOM
  // =========================================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const multEl = document.getElementById('mult');
  const comboEl = document.getElementById('combo');
  const chainEl = document.getElementById('chain');
  const targetLabelEl = document.getElementById('targetLabel');
  const targetBarEl = document.getElementById('targetBar');
  const throwEl = document.getElementById('throwLabel');
  const bestEl = document.getElementById('bestLabel');
  const toastEl = document.getElementById('toast');
  const hintEl = document.getElementById('hint');
  const overlayEl = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const shareBtn = document.getElementById('shareBtn');
  const towerBtn = document.getElementById('towerBtn');

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashSeed(a, b) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 1, 0xc2b2ae35);
    h ^= h >>> 16;
    h = Math.imul(h, 0x7feb352d);
    h ^= h >>> 15;
    return h >>> 0;
  }

  // =========================================================================
  // Canvas / projection
  // =========================================================================
  let W = 0;
  let H = 0;
  let DPR = 1;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initSnow();
  }

  function ppmAt(y) {
    return (W * 1.02 / (WORLD.halfWidth * 2)) / (1 + 0.028 * y);
  }

  function project(x, y) {
    const horizon = H * 0.08;
    const t = clamp(y / WORLD.length, 0, 1.05);
    const sy = H - (H - horizon) * Math.pow(t, 0.92);
    const ppm = ppmAt(y);
    const sx = W / 2 + x * ppm;
    return { sx, sy, ppm, scale: ppm / (W * 1.02 / (WORLD.halfWidth * 2)) };
  }

  function unproject(sx, sy) {
    const horizon = H * 0.08;
    const ratio = clamp((H - sy) / Math.max(1, H - horizon), 0, 1.05);
    const t = Math.pow(ratio, 1 / 0.92);
    const y = clamp(t * WORLD.length, 0, WORLD.length * 1.05);
    const x = (sx - W / 2) / Math.max(1, ppmAt(y));
    return { x, y };
  }

  const AudioFX = (() => {
    let ac = null;
    let master = null;
    let muted = false;
    let noiseBuf = null;

    function init() {
      if (ac) {
        if (ac.state === 'suspended') ac.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.16;
      master.connect(ac.destination);
      const len = Math.floor(ac.sampleRate * 0.5);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }

    function tone(freq, dur, type, vol, slideTo, delay) {
      if (!ac || muted) return;
      const t0 = ac.currentTime + (delay || 0);
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(Math.max(20, freq), t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol || 0.2), t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(master);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    }

    function noise(dur, vol, filterFreq, delay) {
      if (!ac || muted || !noiseBuf) return;
      const t0 = ac.currentTime + (delay || 0);
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = filterFreq || 1200;
      const g = ac.createGain();
      g.gain.setValueAtTime(Math.max(0.0001, vol || 0.2), t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f);
      f.connect(g);
      g.connect(master);
      src.start(t0);
      src.stop(t0 + dur + 0.03);
    }

    return {
      init,
      setMuted(v) { muted = v; },
      isMuted() { return muted; },
      throwStone() {
        noise(0.18, 0.22, 900);
        tone(180, 0.12, 'sine', 0.12, 120);
      },
      gate() {
        tone(660, 0.09, 'triangle', 0.22);
        tone(990, 0.12, 'triangle', 0.18, null, 0.06);
      },
      perfect() {
        tone(880, 0.08, 'square', 0.14);
        tone(1320, 0.14, 'square', 0.12, null, 0.05);
      },
      impact(strength, combo) {
        const s = clamp(strength || 1, 0.3, 2);
        const p = Math.min(20, combo || 0);
        noise(0.09 * s, 0.3 * s, 1600 + p * 30);
        tone(110 + p * 6, 0.12, 'sine', 0.26 * s, 60 + p * 3);
      },
      split() {
        tone(440, 0.06, 'square', 0.16);
        tone(550, 0.06, 'square', 0.14, null, 0.05);
        tone(660, 0.08, 'square', 0.12, null, 0.1);
      },
      sweep() {
        noise(0.08, 0.1, 2600);
      },
      charge(stage) {
        tone(280 + stage * 150, 0.05, 'square', 0.1);
        if (stage >= 4) tone(1200, 0.08, 'triangle', 0.12);
      },
      clear() {
        [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, 'triangle', 0.2, null, i * 0.07));
      },
      win() {
        [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.26, 'triangle', 0.18, null, i * 0.09));
      },
      fail() {
        tone(220, 0.2, 'sawtooth', 0.12, 110);
      }
    };
  })();

  function makeStone(x, y, opts) {
    const o = opts || {};
    const r = o.r == null ? R0 : o.r;
    return {
      x,
      y,
      vx: o.vx || 0,
      vy: o.vy || 0,
      r,
      mass: (r / R0) * (r / R0),
      friction: o.friction == null ? 1.55 : o.friction,
      spin: o.spin || 0,
      magnetTimer: o.magnetTimer || 0,
      magnetRadius: o.magnetRadius || 2.6,
      pierce: o.pierce || 0,
      shield: !!o.shield,
      alive: true,
      active: !!o.active,
      ballId: o.ballId || null,
      ballLevel: o.ballLevel || 1,
      ballColor: o.ballColor || null,
      ballSplitUsed: false,
      ballBomb: o.ballBomb || false,
      ballBombUsed: false,
      ballBounce: o.ballBounce || false,
      trail: []
    };
  }

  function makePin(x, y) {
    return {
      x,
      y,
      r: PIN_R,
      hit: false,
      vx: 0,
      vy: 0,
      life: 1,
      moving: false
    };
  }

  function buildPins(seed) {
    const rng = mulberry32(hashSeed(seed || QUICK_SEED, 777));
    const pins = [];
    const rows = [
      { dy: -2.1, n: 3 },
      { dy: -1.4, n: 4 },
      { dy: -0.7, n: 5 },
      { dy: 0.0, n: 6 },
      { dy: 0.7, n: 5 },
      { dy: 1.4, n: 4 },
      { dy: 2.1, n: 3 }
    ];
    const gap = 0.52 + rng() * 0.06;
    const shift = (rng() - 0.5) * 0.5;
    for (const row of rows) {
      for (let i = 0; i < row.n; i++) {
        const x =
          shift +
          (i - (row.n - 1) / 2) * gap +
          (rng() - 0.5) * 0.16;
        const y = WORLD.houseY + row.dy + (rng() - 0.5) * 0.12;
        pins.push(makePin(x, y));
      }
    }
    return pins;
  }

  function buildCampaignGates(level) {
    const cfg = CAMPAIGN_LEVELS[Math.max(0, Math.min(CAMPAIGN_LEVELS.length - 1, (level || 1) - 1))];
    return cfg.rows.map((row, ri) => ({
      y: row.y,
      gates: row.gates.map((g, gi) => {
        let move = null;
        if (g.move != null) {
          const amp = typeof g.move === 'number' ? g.move : g.move.amp;
          const speed = typeof g.move === 'number' ? 0.8 : g.move.speed;
          const phase = typeof g.move === 'number'
            ? ri * 1.7 + gi * 1.1 + (level || 1) * 0.6
            : g.move.phase;
          move = { amp, speed, phase };
        }
        return { type: g.type, x: g.x, w: g.w, used: false, move };
      })
    }));
  }

  function campaignGridPins(rowCounts, gapX, gapY, cx) {
    const pins = [];
    const centerX = cx || 0;
    for (let r = 0; r < rowCounts.length; r++) {
      const n = rowCounts[r];
      const y = WORLD.houseY + (r - (rowCounts.length - 1) / 2) * gapY;
      for (let i = 0; i < n; i++) {
        const x = centerX + (i - (n - 1) / 2) * gapX;
        pins.push(makePin(x, y));
      }
    }
    return pins;
  }

  function buildCampaignPins(level) {
    const cfg = CAMPAIGN_LEVELS[Math.max(0, Math.min(CAMPAIGN_LEVELS.length - 1, (level || 1) - 1))];
    const pattern = cfg.pins || 'diamond';
    if (pattern === 'sparse') {
      return campaignGridPins([2, 3, 4, 5, 4, 3, 2], 0.6, 0.66, 0);
    }
    if (pattern === 'wall') {
      return campaignGridPins([6, 6, 6, 6, 6], 0.47, 0.62, 0);
    }
    if (pattern === 'clusters') {
      return [
        ...campaignGridPins([4, 4, 4, 4], 0.37, 0.44, -1.35),
        ...campaignGridPins([4, 4, 4, 4], 0.37, 0.44, 1.35)
      ];
    }
    if (pattern === 'ring' || pattern === 'boss' || pattern === 'dense') {
      const pins = [];
      if (pattern === 'ring') {
        for (let i = 0; i < 24; i++) {
          const a = (i / 24) * TAU;
          pins.push(makePin(Math.cos(a) * 1.55, WORLD.houseY + Math.sin(a) * 1.35));
        }
        pins.push(...campaignGridPins([2, 2, 2], 0.55, 0.55, 0));
        return pins;
      }
      if (pattern === 'dense') {
        return campaignGridPins([5, 6, 7, 7, 6, 5], 0.4, 0.46, 0);
      }
      // boss: dense ring + core block
      for (let i = 0; i < 30; i++) {
        const a = (i / 30) * TAU;
        pins.push(makePin(Math.cos(a) * 1.62, WORLD.houseY + Math.sin(a) * 1.42));
      }
      pins.push(...campaignGridPins([3, 4, 3], 0.45, 0.5, 0));
      return pins;
    }
    // default diamond:
    return campaignGridPins([3, 4, 5, 6, 5, 4, 3], 0.52, 0.62, 0);
  }

  function buildGates(seed, floor) {
    const level = Math.max(1, floor || 1);
    const rng = mulberry32(hashSeed(seed || QUICK_SEED, 9001 + level * 17));
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];
    const shuffle = (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    };
    const scale = Math.max(0.82, 1.05 - (level - 1) * 0.04);
    const debuffChance = level <= 1 ? 0 : Math.min(0.45, 0.18 + (level - 1) * 0.08);

    // Random vertical positions, min gap 4.2m
    const y1 = 11.4 + rng() * 2.2;
    const y2 = Math.min(18.5, y1 + 4.2 + rng() * 2.4);
    const y3 = Math.min(25.0, y2 + 4.2 + rng() * 2.4);

    // Row 1: two growth gates covering the center, so early shots are forgiving.
    const growth = shuffle(['sizeUp', 'split']);
    const row1 = {
      y: y1,
      gates: [
        {
          type: growth[0],
          x: -0.5 - rng() * 0.22,
          w: 1.2 + rng() * 0.22,
          used: false
        },
        {
          type: growth[1],
          x: 0.5 + rng() * 0.22,
          w: 1.2 + rng() * 0.22,
          used: false
        }
      ]
    };

    const makePositions = (count) => {
      if (count === 1) return [(rng() - 0.5) * 1.6];
      if (count === 2) {
        return [
          -1.18 + rng() * 0.5,
          0.55 + rng() * 0.5
        ];
      }
      return [
        -1.3 + (rng() - 0.5) * 0.3,
        (rng() - 0.5) * 0.45,
        1.3 + (rng() - 0.5) * 0.3
      ];
    };

    const makeRow = (y, count, buffs, debuffs) => {
      const chosen = [];
      const buffPool = shuffle(buffs);
      const debuffPool = shuffle(debuffs);
      for (let i = 0; i < count; i++) {
        const wantDebuff = i > 0 && rng() < debuffChance && debuffPool.length > 0;
        const type = wantDebuff ? debuffPool.pop() : buffPool.pop();
        chosen.push(type || pick(buffs));
      }
      if (chosen.every((t) => debuffs.includes(t))) {
        chosen[0] = pick(buffs);
      }
      const positions = makePositions(count);
      return {
        y,
        gates: chosen.map((type, i) => {
          const isDebuff = debuffs.includes(type);
          return {
            type,
            x: positions[i],
            w: (isDebuff ? 0.58 + rng() * 0.08 : 0.82 + rng() * 0.22) * scale,
            used: false
          };
        })
      };
    };

    const row2Count = level <= 1 ? 2 : rng() < 0.35 ? 1 : rng() < 0.55 ? 2 : 3;
    const row3Count = level <= 1 ? 2 : rng() < 0.4 ? 1 : rng() < 0.6 ? 2 : 3;
    const row2 = makeRow(
      y2,
      row2Count,
      ['speedUp', 'mult', 'magnet', 'pierce'],
      ['sticky']
    );
    const row3 = makeRow(
      y3,
      row3Count,
      ['magnet', 'pierce', 'mult'],
      ['shrink', 'sticky']
    );

    let rows = [row1, row2, row3];
    if (level >= 2 && rng() < 0.45) {
      const y4 = Math.min(26.2, y3 + 3.8 + rng() * 2.4);
      rows.push(
        makeRow(
          y4,
          rng() < 0.55 ? 1 : 2,
          ['mult', 'magnet', 'pierce'],
          ['sticky', 'shrink']
        )
      );
    }

    if (level >= 2) {
      for (const row of rows) {
        for (const gate of row.gates) {
          if (rng() < 0.35) {
            gate.move = {
              amp: 0.16 + rng() * 0.28,
              speed: 0.7 + rng() * 0.9,
              phase: rng() * TAU
            };
          }
        }
      }
    }

    return rows;
  }

  function gateX(gate) {
    if (!gate.move) return gate.x;
    return (
      gate.x +
      Math.sin(game.time * gate.move.speed + gate.move.phase) * gate.move.amp
    );
  }

  // =========================================================================
  // Scoring
  // =========================================================================
  function totalMult() {
    const comboMult = Math.min(COMBO_MULT_MAX, game.combo * 0.1);
    const chainMult = Math.min(2, Math.max(0, game.gateChain - 1) * 0.5);
    const val = Math.min(TOTAL_MULT_MAX, 1 + game.gateMult + comboMult + chainMult);
    if (val > game.maxMult) game.maxMult = val;
    if (val > game.throwMaxMult) game.throwMaxMult = val;
    return val;
  }

  function starsFor(score) {
    if (score >= THREE_STAR_SCORE) return 3;
    if (score >= TARGET_SCORE) return 2;
    if (score >= TARGET_SCORE / 2) return 1;
    return 0;
  }

  function getSelectedBall() {
    const t = game.tower;
    return t.balls[Math.max(0, Math.min(t.balls.length - 1, t.selectedBall))] || t.balls[0];
  }

  function isRunMode() {
    return game.mode === 'tower' || game.mode === 'campaign';
  }

  function ballType(ball) {
    return BALL_TYPES[ball.id] || BALL_TYPES.standard;
  }

  function ballPower(ball) {
    return 1 + 0.18 * (ball.level - 1) + ballType(ball).atk;
  }

  function ballRadius(ball) {
    return R0 * ballType(ball).radius * (1 + 0.05 * (ball.level - 1));
  }

  function ballSpinMult(ball) {
    return ball.id === 'curl' ? 1.6 + 0.12 * (ball.level - 1) : 1;
  }

  function towerAtkBonus() {
    return ballPower(getSelectedBall()) - 1;
  }

  function haptic(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) {
      /* ignore */
    }
  }

  // =========================================================================
  // FX
  // =========================================================================
  function burst(x, y, color, count, speed) {
    const n = count || 10;
    const sp = speed || 0.8;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const v = (0.5 + Math.random()) * sp;
      game.particles.push({
        type: 'dot',
        x,
        y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 0.45 + Math.random() * 0.35,
        maxLife: 0.8,
        size: 0.02 + Math.random() * 0.05,
        color
      });
    }
  }

  function ring(x, y, color) {
    game.particles.push({
      type: 'ring',
      x,
      y,
      vx: 0,
      vy: 0,
      life: 0.7,
      maxLife: 0.7,
      size: 0.4,
      color
    });
  }

  function addPopup(x, y, text, color, size) {
    game.popups.push({
      x,
      y,
      text,
      color: color || '#eaf7ff',
      size: size || 1,
      life: 1.1,
      maxLife: 1.1
    });
  }

  let toastTimer = null;
  function showToast(text, duration) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration || 1000);
  }

  function clearMoment() {
    if (game.cleared) return;
    game.cleared = true;
    game.slowTimer = 0.55;
    game.flash = 0.9;
    game.shake = 16;
    game.hitStop = 0.05;
    addPopup(0, WORLD.houseY, '清 屏 !', '#ffd34d', 2.1);
    ring(0, WORLD.houseY, '#ffd34d');
    haptic([20, 30, 40]);
    AudioFX.clear();
  }

  // =========================================================================
  // Game flow
  // =========================================================================
  function startGame(mode) {
    AudioFX.init();
    const nextMode = mode || game.mode || 'campaign';
    game.mode = nextMode;
    overlayEl.classList.remove('show');
    overlayEl.style.display = 'none';
    overlayEl.classList.remove('result');
    resultStatsEl.classList.add('hidden');
    towerOverlay.classList.add('hidden');
    levelSelectEl.classList.add('hidden');

    if (nextMode === 'tower') {
      startTower();
    } else if (nextMode === 'campaign') {
      startCampaign();
    } else {
      startQuick();
    }
  }

  function resetRunBase() {
    game.score = 0;
    game.displayScore = 0;
    game.throwIndex = 0;
    game.runHitPins = 0;
    game.throwScores = [];
    game.gateMult = 0;
    game.combo = 0;
    game.maxMult = 1;
    game.maxCombo = 0;
    game.maxChain = 0;
    game.gateChain = 0;
    game.cleared = false;
    game.best = loadBest();
  }

  function startQuick() {
    resetRunBase();
    game.targetScore = TARGET_SCORE;
    game.runTotalPins = 3 * buildPins(QUICK_SEED).length;
    startThrow();
  }

  function startTower() {
    resetRunBase();
    levelBtn.classList.add('hidden');
    const t = game.tower;
    t.floor = 1;
    t.def = TOWER_BASE_DEF;
    t.hearts = 3;
    t.floorDamage = 0;
    t.bestFloor = loadTowerBest();
    t.runSeed = (Math.random() * 1e9) | 0;
    t.floorSeed = hashSeed(t.runSeed, 1);
    t.options = [];
    t.balls = [{ id: 'standard', level: 1, count: 1, used: 0 }];
    t.selectedBall = 0;
    t.upgraded = false;
    t.chosenOption = -1;
    game.targetScore = TOWER_BASE_DEF;
    game.runTotalPins = 0;
    startThrow();
  }

  function startCampaign() {
    game.mode = 'campaign';
    game.campaign.maxLevel = loadCampaignBest();
    showLevelSelect();
  }

  function levelGoalShort(cfg) {
    const g = cfg.goal;
    if (g.type === 'pins') return '钉子 ' + g.value;
    if (g.type === 'gates') return '门 ' + g.value;
    return '伤害 ' + fmt(g.value);
  }

  function showLevelSelect() {
    game.mode = 'campaign';
    game.phase = 'levelSelect';
    game.campaign.maxLevel = loadCampaignBest();
    overlayEl.classList.remove('show');
    overlayEl.style.display = 'none';
    towerOverlay.classList.add('hidden');
    ballBar.classList.add('hidden');
    levelSelectEl.classList.remove('hidden');
    levelBtn.classList.add('hidden');
    renderLevelSelect();
  }

  function renderLevelSelect() {
    if (!levelGrid) return;
    levelGrid.innerHTML = '';
    const cleared = game.campaign.maxLevel;
    CAMPAIGN_LEVELS.forEach((cfg, i) => {
      const level = i + 1;
      const unlocked = level <= Math.min(CAMPAIGN_LEVELS.length, cleared + 1);
      const done = level <= cleared;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'level-btn' + (unlocked ? '' : ' locked') + (done ? ' cleared' : '');
      btn.disabled = !unlocked;
      btn.innerHTML =
        '<span class="level-num">' + String(level).padStart(2, '0') + '</span>' +
        '<b>' + cfg.name + '</b>' +
        '<span class="level-goal">' + levelGoalShort(cfg) + '</span>' +
        '<span class="level-state">' + (done ? '✓ 已通关' : unlocked ? '可挑战' : '🔒 未解锁') + '</span>';
      if (unlocked) {
        btn.addEventListener('click', () => startCampaignLevel(level));
      }
      levelGrid.appendChild(btn);
    });
  }

  function startCampaignLevel(level) {
    const c = game.campaign;
    const n = Math.max(1, Math.min(CAMPAIGN_LEVELS.length, level || 1));
    c.maxLevel = loadCampaignBest();
    if (n > Math.min(CAMPAIGN_LEVELS.length, c.maxLevel + 1) && n > 1) {
      showToast('先通关前面的关卡', 900);
      return;
    }
    levelSelectEl.classList.add('hidden');
    overlayEl.classList.remove('show');
    overlayEl.style.display = 'none';
    towerOverlay.classList.add('hidden');
    resetRunBase();
    game.mode = 'campaign';
    loadCampaignLevel(n);
  }

  function loadCampaignLevel(level) {
    const c = game.campaign;
    const t = game.tower;
    const index = Math.max(0, Math.min(CAMPAIGN_LEVELS.length - 1, (level || 1) - 1));
    c.level = index + 1;
    c.config = CAMPAIGN_LEVELS[index];
    c.goal = c.config.goal;
    c.damage = 0;
    c.pinsHit = 0;
    c.gatesHit = 0;
    c.victory = false;
    t.floor = c.level;
    t.def = c.config.def;
    t.floorDamage = 0;
    t.balls = c.config.balls.map((b) => ({
      id: b.id,
      level: b.level || 1,
      count: b.count || 1,
      used: 0
    }));
    levelBtn.classList.remove('hidden');
    t.selectedBall = 0;
    t.options = [];
    t.upgraded = false;
    t.chosenOption = -1;
    game.score = 0;
    game.displayScore = 0;
    game.throwStartScore = 0;
    game.throwScores = [];
    game.throwIndex = 0;
    game.phase = 'aim';
    startThrow();
    showToast(
      '第 ' + c.level + ' 关 · ' + c.config.name + ' — ' + campaignGoalShort(),
      1800
    );
  }

  function campaignGoalShort() {
    const g = game.campaign.goal;
    if (!g) return '伤害达标';
    if (g.type === 'pins') return '撞中 ' + g.value + ' 个钉子';
    if (g.type === 'gates') return '触发 ' + g.value + ' 个门';
    return '伤害达到 ' + fmt(g.value);
  }

  function campaignGoalMet() {
    const c = game.campaign;
    const g = c.goal;
    if (!g) return false;
    if (g.type === 'damage') return c.damage >= g.value;
    if (g.type === 'pins') return c.pinsHit >= g.value;
    if (g.type === 'gates') return c.gatesHit >= g.value;
    return false;
  }

  function campaignGoalProgress() {
    const c = game.campaign;
    const g = c.goal;
    if (!g) return { value: 0, need: 1 };
    if (g.type === 'pins') return { value: c.pinsHit, need: g.value };
    if (g.type === 'gates') return { value: c.gatesHit, need: g.value };
    if (g.type === 'damage') return { value: c.damage, need: g.value };
    return { value: 0, need: 1 };
  }

  function campaignGoalProgressText() {
    const c = game.campaign;
    const p = campaignGoalProgress();
    if (c.goal && c.goal.type === 'pins') return '钉子 ' + p.value + '/' + p.need;
    if (c.goal && c.goal.type === 'gates') return '门 ' + p.value + '/' + p.need;
    return '伤害 ' + fmt(p.value) + '/' + fmt(p.need);
  }

  function startThrow() {
    game.phase = 'aim';
    game.throwsTotal = isRunMode()
      ? Math.max(1, game.tower.balls.reduce((sum, b) => sum + b.count, 0))
      : 3;
    game.targetScore = game.mode === 'tower'
      ? game.tower.def
      : game.mode === 'campaign'
        ? campaignGoalProgress().need
        : TARGET_SCORE;
    game.throwStartScore = game.score;
    game.throwMaxMult = 1;
    if (isRunMode()) {
      const t = game.tower;
      let idx = t.selectedBall;
      if (!t.balls[idx] || t.balls[idx].used >= t.balls[idx].count) {
        idx = t.balls.findIndex((b) => b.used < b.count);
      }
      if (idx < 0) {
        if (game.mode === 'campaign') {
          resolveCampaignLevel();
        } else {
          resolveTowerFloor();
        }
        return;
      }
      t.selectedBall = idx;
    }
    const selected = isRunMode() ? getSelectedBall() : null;
    const selectedType = selected ? ballType(selected) : null;
    game.stones = [
      makeStone(0, WORLD.releaseY, selected ? {
        r: ballRadius(selected),
        ballId: selected.id,
        ballLevel: selected.level,
        ballColor: selectedType.color
      } : {})
    ];
    if (game.mode === 'campaign') {
      game.gates = buildCampaignGates(game.campaign.level);
      game.pins = buildCampaignPins(game.campaign.level);
    } else {
      const layoutSeed = game.mode === 'tower' ? game.tower.floorSeed : QUICK_SEED;
      game.gates = buildGates(layoutSeed, game.mode === 'tower' ? game.tower.floor : 1);
      game.pins = buildPins(layoutSeed);
    }
    game.totalPins = game.pins.length;
    game.hitPins = 0;
    game.combo = 0;
    game.comboTimer = 0;
    game.gateMult = 0;
    game.gateChain = 0;
    game.bigMoment = false;
    game.waveMoment = false;
    game.hitStop = 0;
    game.cleared = false;
    game.aim.charging = false;
    game.aim.angle = 0;
    setSpinUI();
    game.settleTimer = 0.3;
    game.betweenTimer = 0;
    game.particles = [];
    game.popups = [];
    toastEl.classList.remove('show');
    renderBallBar();
    updateHUD();
  }

  function doThrow() {
    const s = game.stones[0];
    if (!s || !s.alive) return;
    const speed = FULL_SPEED;
    s.vx = Math.sin(game.aim.angle) * speed;
    s.vy = Math.cos(game.aim.angle) * speed;
    s.spin =
      game.spin *
      (isRunMode() ? ballSpinMult(getSelectedBall()) : 1);
    s.active = true;
    if (isRunMode()) {
      const b = getSelectedBall();
      b.used += 1;
    }
    if (s.ballId === 'magnet') {
      s.magnetTimer = 4;
      s.magnetRadius = 2.8;
    }
    if (s.ballId === 'pierce') s.pierce = 3;
    if (s.ballId === 'bounce') s.ballBounce = true;
    if (s.ballId === 'bomb') s.ballBomb = true;
    game.phase = 'slide';
    game.aim.charging = false;
    game.settleTimer = 0.3;
    renderBallBar();
    AudioFX.throwStone();
  }

  function finishThrow() {
    if (game.phase !== 'slide') return;
    scoreHouse();
    let clearBonus = 0;
    if (game.totalPins > 0 && game.hitPins >= game.totalPins) {
      clearBonus = 800 * Math.max(1, game.throwMaxMult);
      game.score += clearBonus;
      addPopup(0, WORLD.houseY - 1, '清屏奖励 +' + Math.round(clearBonus), '#ffd34d', 1.4);
    }
    const gained = Math.round(game.score - game.throwStartScore);
    game.throwScores.push(gained);
    game.lastThrowScore = gained;
    game.phase = 'between';
    game.settleTimer = 0;
    game.betweenTimer = 1.0;
    renderBallBar();

    if (game.mode === 'campaign') {
      const c = game.campaign;
      const damage = Math.round(gained * (1 + towerAtkBonus()));
      c.damage += damage;
      game.tower.floorDamage = c.damage;
      game.throwStartScore = game.score;
      if (campaignGoalMet()) {
        game.betweenTimer = 0.45;
        showToast('目标达成！' + campaignGoalProgressText(), 900);
      } else {
        showToast('第 ' + (game.throwIndex + 1) + ' 壶 · ' + campaignGoalProgressText(), 900);
      }
    } else if (game.mode === 'tower') {
      const damage = Math.round(gained * (1 + towerAtkBonus()));
      game.tower.floorDamage += damage;
      game.throwStartScore = game.score;
      if (game.tower.floorDamage >= game.tower.def) {
        game.betweenTimer = 0.45;
        showToast('达标！伤害 ' + fmt(game.tower.floorDamage) + ' / ' + fmt(game.tower.def), 900);
      } else {
        showToast('第 ' + (game.throwIndex + 1) + ' 壶 +' + fmt(damage) + ' 伤害', 900);
      }
    } else {
      showToast('第 ' + (game.throwIndex + 1) + ' 壶 +' + fmt(gained) + (clearBonus ? ' · 清屏!' : ''), 900);
    }
  }

  function advanceBetween() {
    if (game.mode === 'campaign' && campaignGoalMet()) {
      resolveCampaignLevel();
      return;
    }
    if (
      game.mode === 'tower' &&
      game.tower.floorDamage >= game.tower.def
    ) {
      resolveTowerFloor();
      return;
    }
    nextThrow();
  }

  function nextThrow() {
    if (game.mode === 'campaign') {
      if (campaignGoalMet()) {
        resolveCampaignLevel();
        return;
      }
      if (!game.tower.balls.some((b) => b.used < b.count)) {
        resolveCampaignLevel();
        return;
      }
      game.throwIndex += 1;
      if (game.throwIndex >= game.throwsTotal) {
        resolveCampaignLevel();
        return;
      }
      startThrow();
      return;
    }

    if (game.mode === 'tower') {
      if (game.tower.floorDamage >= game.tower.def) {
        resolveTowerFloor();
        return;
      }
      if (!game.tower.balls.some((b) => b.used < b.count)) {
        resolveTowerFloor();
        return;
      }
      game.throwIndex += 1;
      if (game.throwIndex >= game.throwsTotal) {
        resolveTowerFloor();
        return;
      }
      startThrow();
      return;
    }

    game.throwIndex += 1;
    if (game.throwIndex >= game.throwsTotal) {
      showResult();
      return;
    }
    startThrow();
  }

  function resolveCampaignLevel() {
    const c = game.campaign;
    if (campaignGoalMet()) {
      c.maxLevel = Math.max(c.maxLevel, c.level);
      saveCampaignBest(c.maxLevel);
      AudioFX.win();
      haptic([20, 30, 40]);
      if (c.level >= CAMPAIGN_LEVELS.length) {
        c.victory = true;
        showResult();
      } else {
        showCampaignClear();
      }
      return;
    }

    AudioFX.fail();
    haptic(20);
    showCampaignFail();
  }

  function showCampaignClear() {
    const c = game.campaign;
    game.phase = 'campaignClear';
    towerOverlay.classList.remove('hidden');
    towerBadge.textContent = '第 ' + c.level + ' 关通过';

    towerSub.textContent = campaignGoalProgressText() + ' · 已解锁下一关';
    towerBalls.classList.add('hidden');
    towerTip.classList.add('hidden');
    towerAtk.classList.add('hidden');
    towerNextBtn.classList.remove('hidden');
    towerNextBtn.textContent = c.level >= CAMPAIGN_LEVELS.length ? '查看结算' : '进入第 ' + (c.level + 1) + ' 关';
    towerNextBtn.disabled = false;
    towerRetryBtn.classList.add('hidden');
    towerEndBtn.classList.remove('hidden');
    towerEndBtn.textContent = '返回选关';
  }

  function showCampaignFail() {
    const c = game.campaign;
    game.phase = 'campaignFail';
    towerOverlay.classList.remove('hidden');
    towerBadge.textContent = '第 ' + c.level + ' 关 · ' + c.config.name;

    towerSub.textContent = campaignGoalProgressText() + ' · 每关独立，可随时重试';
    towerBalls.classList.add('hidden');
    towerTip.classList.add('hidden');
    towerAtk.classList.add('hidden');
    towerNextBtn.classList.add('hidden');
    towerRetryBtn.classList.remove('hidden');
    towerRetryBtn.textContent = '重试本关';
    towerEndBtn.classList.remove('hidden');
    towerEndBtn.textContent = '返回选关';
  }

  function nextCampaignLevel() {
    const c = game.campaign;
    if (c.level >= CAMPAIGN_LEVELS.length) {
      towerOverlay.classList.add('hidden');
      showLevelSelect();
      return;
    }
    towerOverlay.classList.add('hidden');
    loadCampaignLevel(c.level + 1);
  }

  function retryCampaignLevel() {
    const c = game.campaign;
    towerOverlay.classList.add('hidden');
    loadCampaignLevel(c.level);
  }

  function resolveTowerFloor() {
    const t = game.tower;
    if (t.floorDamage >= t.def) {
      t.bestFloor = Math.max(t.bestFloor, t.floor);
      saveTowerBest(t.bestFloor);
      AudioFX.win();
      haptic([20, 30, 40]);
      showTowerClear();
      return;
    }

    t.hearts = Math.max(0, t.hearts - 1);
    if (t.hearts <= 0) {
      t.bestFloor = Math.max(t.bestFloor, t.floor - 1);
      saveTowerBest(t.bestFloor);
      AudioFX.fail();
      showResult();
      return;
    }
    AudioFX.fail();
    haptic(20);
    showTowerFail();
  }

  function showTowerClear() {
    const t = game.tower;
    game.phase = 'towerClear';
    towerOverlay.classList.remove('hidden');
    towerBadge.textContent = '第 ' + t.floor + ' 层突破';
    towerTitle.textContent = '选择 1 个冰球';
    towerSub.textContent = '伤害 ' + fmt(t.floorDamage) + ' / 防御 ' + fmt(t.def);
    towerBalls.classList.remove('hidden');
    towerTip.classList.remove('hidden');
    towerAtk.classList.remove('hidden');
    towerNextBtn.classList.remove('hidden');
    towerNextBtn.textContent = '进入第 ' + (t.floor + 1) + ' 层';
    towerNextBtn.disabled = true;
    towerRetryBtn.classList.add('hidden');
    towerEndBtn.classList.add('hidden');
    t.upgraded = false;
    t.chosenOption = -1;
    t.options = rollTowerOptions();
    renderTowerBalls();
    updateTowerAtkLabel();
  }

  function showTowerFail() {
    const t = game.tower;
    game.phase = 'towerFail';
    towerOverlay.classList.remove('hidden');
    towerBadge.textContent = '第 ' + t.floor + ' 层';
    towerTitle.textContent = '防御不足';
    towerSub.textContent =
      '伤害 ' + fmt(t.floorDamage) + ' / 防御 ' + fmt(t.def) + ' · 剩余 ' + t.hearts + ' 心';
    towerBalls.classList.add('hidden');
    towerTip.classList.add('hidden');
    towerAtk.classList.add('hidden');
    towerNextBtn.classList.add('hidden');
    towerRetryBtn.classList.remove('hidden');
    towerRetryBtn.textContent = '重试本层（❤' + t.hearts + '）';
    towerEndBtn.classList.remove('hidden');
    towerEndBtn.textContent = '放弃回主页';
  }

  function rollTowerOptions() {
    const t = game.tower;
    const pool = [];
    for (const id of Object.keys(BALL_TYPES)) {
      pool.push({ kind: 'new', id });
    }
    t.balls.forEach((b, i) => {
      if (b.level < 5) pool.push({ kind: 'upgrade', index: i });
    });
    const shuffled = pool.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = tmp;
    }
    return shuffled.slice(0, 3);
  }

  function renderTowerBalls() {
    const t = game.tower;
    towerBalls.innerHTML = '';
    t.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ball-card';
      if (t.chosenOption === i) btn.classList.add('selected');
      if (t.upgraded) btn.disabled = true;

      if (opt.kind === 'new') {
        const type = BALL_TYPES[opt.id];
        const owned = t.balls.find((b) => b.id === opt.id);
        const meta = owned
          ? '新增 1 颗 · 已有 Lv.' + owned.level + ' ×' + owned.count
          : '获得 Lv.1';
        btn.innerHTML =
          '<b>' + type.name + ' · 新冰球</b>' +
          '<span class="ball-meta">' + meta + '</span>' +
          '<span class="ball-desc">' + type.desc + '</span>';
      } else if (opt.kind === 'upgrade') {
        const ball = t.balls[opt.index];
        const type = ballType(ball);
        btn.innerHTML =
          '<b>' + type.name + ' Lv.' + ball.level + ' → Lv.' + (ball.level + 1) + '</b>' +
          '<span class="ball-meta">该种类全部 +18% 攻击</span>' +
          '<span class="ball-desc">' + type.desc + '</span>';
      } else {
        btn.innerHTML =
          '<b>恢复 1 心</b>' +
          '<span class="ball-meta">当前 ❤' + t.hearts + '</span>' +
          '<span class="ball-desc">球少的时候可以保命</span>';
      }

      btn.addEventListener('click', () => chooseTowerOption(i));
      towerBalls.appendChild(btn);
    });
  }

  function chooseTowerOption(i) {
    const t = game.tower;
    if (t.upgraded) return;
    const opt = t.options[i];
    if (!opt) return;
    if (opt.kind === 'new') {
      const existing = t.balls.findIndex((b) => b.id === opt.id);
      if (existing >= 0) {
        t.balls[existing].count += 1;
        t.selectedBall = existing;
      } else {
        t.balls.push({ id: opt.id, level: 1, count: 1, used: 0 });
        t.selectedBall = t.balls.length - 1;
      }
    } else if (opt.kind === 'upgrade') {
      t.balls[opt.index].level = Math.min(5, t.balls[opt.index].level + 1);
      t.selectedBall = opt.index;
    } else {
      t.hearts = Math.min(5, t.hearts + 1);
    }
    t.upgraded = true;
    t.chosenOption = i;
    AudioFX.gate();
    haptic(12);
    renderTowerBalls();
    renderBallBar();
    updateTowerAtkLabel();
    towerNextBtn.disabled = false;
  }

  function renderBallBar() {
    const t = game.tower;
    ballBar.innerHTML = '';
    if (!isRunMode()) {
      ballBar.classList.add('hidden');
      return;
    }
    ballBar.classList.remove('hidden');
    ballBar.style.justifyContent = t.balls.length <= 4 ? 'center' : 'flex-start';
    t.balls.forEach((ball, i) => {
      const type = ballType(ball);
      const remaining = ball.count - ball.used;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ball-chip';
      if (i === t.selectedBall && remaining > 0) btn.classList.add('selected');
      if (remaining <= 0) btn.classList.add('used');
      btn.disabled = game.phase !== 'aim' || remaining <= 0;
      btn.innerHTML =
        '<span class="ball-name">' +
        type.name.replace('球', '') +
        ' ×' +
        remaining +
        '</span><span class="ball-lv">Lv.' +
        ball.level +
        '</span>';
      if (i === t.selectedBall) btn.style.borderColor = type.color;
      btn.addEventListener('click', () => selectBall(i));
      ballBar.appendChild(btn);
    });
    const selected = ballBar.querySelector('.ball-chip.selected');
    if (selected) {
      const target =
        selected.offsetLeft - (ballBar.clientWidth - selected.clientWidth) / 2;
      ballBar.scrollLeft = Math.max(0, target);
    }
  }

  function selectBall(i) {
    const t = game.tower;
    if (!isRunMode() || game.phase !== 'aim') return;
    if (!t.balls[i] || t.balls[i].used >= t.balls[i].count) return;
    t.selectedBall = i;
    const s = game.stones[0];
    if (s) {
      const ball = t.balls[i];
      const type = ballType(ball);
      s.r = ballRadius(ball);
      s.mass = (s.r / R0) * (s.r / R0);
      s.ballId = ball.id;
      s.ballLevel = ball.level;
      s.ballColor = type.color;
    }
    AudioFX.gate();
    haptic(8);
    renderBallBar();
    updateHUD();
  }

  function updateTowerAtkLabel() {
    const ball = getSelectedBall();
    const type = ballType(ball);
    towerAtk.textContent =
      '当前：' +
      type.name +
      ' Lv.' +
      ball.level +
      ' · 攻击 +' +
      Math.round((ballPower(ball) - 1) * 100) +
      '%';
  }

  function nextTowerFloor() {
    const t = game.tower;
    if (!t.upgraded) return;
    towerOverlay.classList.add('hidden');
    t.floor += 1;
    t.def = Math.round(t.def * TOWER_DEF_GROWTH);
    t.floorDamage = 0;
    t.floorSeed = hashSeed(t.runSeed, t.floor);
    t.options = [];
    t.upgraded = false;
    t.chosenOption = -1;
    t.balls.forEach((b) => { b.used = 0; });
    game.throwIndex = 0;
    game.throwScores = [];
    game.phase = 'aim';
    startThrow();
  }

  function retryTowerFloor() {
    const t = game.tower;
    towerOverlay.classList.add('hidden');
    t.floorDamage = 0;
    t.upgraded = false;
    t.options = [];
    t.chosenOption = -1;
    t.balls.forEach((b) => { b.used = 0; });
    game.throwIndex = 0;
    game.throwScores = [];
    game.phase = 'aim';
    startThrow();
  }

    if (game.mode === 'campaign') {
      const c = game.campaign;
      const t = game.tower;
      const cleared = Math.max(0, c.maxLevel);
      if (titleEl) titleEl.textContent = c.victory ? '闯关成功！' : '闯关结束';

      resultStatsEl.innerHTML =
        '<div class="rs-row"><span>到达关卡</span><b>第 ' + c.level + ' / 10 关</b></div>' +

      if (c.victory) {
        AudioFX.win();
        haptic([20, 30, 40, 30]);
      } else {
        AudioFX.fail();
        haptic(20);
      }
      return;
    }

    if (game.mode === 'tower') {
      const t = game.tower;
      startBtn.textContent = '重新爬塔';
      footnoteEl.textContent = '爬塔模式 · 最高第 ' + t.bestFloor + ' 层';
      resultStatsEl.innerHTML =
        '<div class="rs-row"><span>到达层数</span><b>第 ' + t.floor + ' 层</b></div>' +
        '<div class="rs-row"><span>最高层数</span><b>第 ' + t.bestFloor + ' 层</b></div>' +
        '<div class="rs-row"><span>剩余心数</span><b>' + '❤'.repeat(Math.max(0, t.hearts)) + '</b></div>' +
        '<div class="rs-row"><span>攻击加成</span><b>+' + Math.round(towerAtkBonus() * 100) + '%</b></div>' +
        '<div class="rs-row"><span>最高冰球</span><b>Lv.' + Math.max(...t.balls.map((b) => b.level)) + '</b></div>' +
        '<div class="rs-row"><span>通关层数</span><b>' + Math.max(0, t.floor - 1) + '</b></div>';
      AudioFX.fail();
      haptic(20);
      return;
    }

    const score = Math.round(game.score);
    if (score > game.best) {
      game.best = score;
      saveBest(score);
    }
    startBtn.textContent = '再来一局';
    footnoteEl.textContent = '3 壶 · 目标 6,000 · 3 星 10,000';
    const stars = starsFor(score);
    const starText = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    let hint;
    if (score >= THREE_STAR_SCORE) hint = '三星达成，漂亮！';
    else if (score >= game.targetScore) hint = '二星达成，再冲 ' + fmt(THREE_STAR_SCORE);
    else hint = '距离目标还差 ' + fmt(game.targetScore - score) + ' 分';

    const rows = game.throwScores
      .map((s, i) => '<span>第' + (i + 1) + '壶 ' + fmt(s) + '</span>')
      .join('');
    resultStatsEl.innerHTML =
      '<div class="rs-stars">' + starText + '</div>' +
      '<div class="rs-row"><span>本局得分</span><b>' + fmt(score) + '</b></div>' +
      '<div class="rs-row"><span>最高分</span><b>' + fmt(game.best) + '</b></div>' +
      '<div class="rs-row"><span>最高倍率</span><b>×' + game.maxMult.toFixed(1) + '</b></div>' +
      '<div class="rs-row"><span>最高连击</span><b>' + game.maxCombo + '</b></div>' +
      '<div class="rs-row"><span>最高门链</span><b>x' + game.maxChain + '</b></div>' +
      '<div class="rs-row"><span>命中钉子</span><b>' + game.runHitPins + '/' + game.runTotalPins + '</b></div>' +
      '<div class="rs-hint">' + hint + '</div>' +
      '<div class="rs-throws">' + rows + '</div>';
    if (stars > 0) {
      AudioFX.win();
    } else {
      AudioFX.fail();
    }
    haptic(stars > 0 ? [15, 40, 20] : 20);
  }

  // =========================================================================
  // Input
  // =========================================================================
  function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function updateAimAngle() {
    const stone = game.stones[0];
    if (!stone) return;
    const target = unproject(game.aim.curX, game.aim.curY);
    const raw = Math.atan2(target.x - stone.x, target.y - stone.y);
    game.aim.angle = clamp(Number.isFinite(raw) ? raw : 0, -1.15, 1.15);
  }

  function setSpin(v) {
    game.spin = v;
    saveSpin(v);
    setSpinUI();
  }

  function setSpinUI() {
    document.querySelectorAll('.spin-btn').forEach((b) => {
      b.classList.toggle('active', Number(b.dataset.spin) === game.spin);
    });
  }

  canvas.addEventListener('pointerdown', (e) => {
    AudioFX.init();
    if (game.phase === 'between') {
      advanceBetween();
      return;
    }
    if (game.phase === 'aim') {
      if (game.aim.charging) return;
      const p = getPointerPos(e);
      game.aim.charging = true;
      game.aim.startX = p.x;
      game.aim.curX = p.x;
      game.aim.curY = p.y;
      game.aim.angle = 0;
      updateAimAngle();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (game.phase === 'aim' && game.aim.charging) {
      const p = getPointerPos(e);
      game.aim.curX = p.x;
      game.aim.curY = p.y;
      updateAimAngle();
    }
  });

  function endPointer() {
    if (game.phase === 'aim' && game.aim.charging) {
      game.aim.charging = false;
      doThrow();
    }
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', () => {
    game.aim.charging = false;
  });

  document.querySelectorAll('.spin-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      AudioFX.init();
      setSpin(Number(btn.dataset.spin));
    });
  });

  levelBackBtn.addEventListener('click', () => {
    AudioFX.init();
    showMenu();
  });

  startBtn.addEventListener('click', () => {
    AudioFX.init();
    startGame(game.mode === 'tower' ? 'tower' : 'campaign');
  });

  towerBtn.addEventListener('click', () => {
    AudioFX.init();
    startGame('tower');
  });

  homeBtn.addEventListener('click', () => {
    AudioFX.init();
    showMenu();
  });

  function shareResult() {
    let text;
    if (game.mode === 'campaign') {
      text = '我在冰壶大作战闯到第 ' + game.campaign.level + ' 关（最高第 ' + game.campaign.maxLevel + ' 关），来挑战！';
    } else if (game.mode === 'tower') {
      text = '我在冰壶大作战爬到第 ' + game.tower.floor + ' 层，最高第 ' + game.tower.bestFloor + ' 层，来挑战！';
    } else {
      text = '我在冰壶大作战拿到 ' + fmt(game.score) + ' 分（' + '★'.repeat(starsFor(Math.round(game.score))) + '），来挑战！';
    }
    const url = location.href;
    if (navigator.share) {
      try {
        navigator.share({ title: '冰壶大作战', text, url }).catch(() => {});
      } catch (e) {

        .then(() => showToast('已复制成绩', 900))
        .catch(() => showToast('分享不可用，截图吧', 900));
      return;
    }
    showToast('分享不可用，截图吧', 900);
  }
